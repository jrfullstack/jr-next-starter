name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel previous runs of the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholder values so T3-env validation passes; no job connects to a database
env:
  DATABASE_URL: postgresql://user:password@localhost:5432/ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Opt out of Next.js and Prisma CLI telemetry
  NEXT_TELEMETRY_DISABLED: 1
  CHECKPOINT_DISABLE: 1

jobs:
  quality:
    name: Lint, typecheck, dead code, duplicates & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused code (knip)
        run: pnpm knip

      - name: Duplicated code (jscpd)
        run: pnpm dup

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # CI=true (set by GitHub) makes Playwright start the production build
      - name: E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Lint PR commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
