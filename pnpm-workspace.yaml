allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  prisma: true
  sharp: false
  unrs-resolver: false
# Security fixes for transitive deps of the prisma CLI (dev only). Remove when prisma bumps them.
overrides:
  deepmerge-ts@<8.0.0: ^8.0.0
  mysql2@<3.23.1: ^3.23.1
